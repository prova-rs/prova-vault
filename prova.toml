# One manifest, two hats. This package both exports a namespace (a package — `[package]`) and runs
# its own proofs (a suite). A consumer instead pins it by source — a released tag:
#   vault = { git = "https://github.com/prova-rs/prova-vault", tag = "v1.0" }
[package]
name        = "vault"
description = "HashiCorp Vault — ephemeral dev-mode server, KV v2 seeded and asserted over the vault CLI, zero native code"
license     = "MIT"

# The range of prova versions this package is built against; a consumer is checked against it.
[requires]
prova = ">= 0.16"

[run]
proofs = ["proofs"]

# Resolve THIS package from its own directory, so the self-tests can `require("vault")` exactly
# as a consumer would.
[dependencies]
vault = { path = "." }
